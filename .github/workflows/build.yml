name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "Using the signing key from repository secrets."
            {
              echo "ZT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ZT_KEY_ALIAS=$KEY_ALIAS"
              echo "ZT_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set. Signing with a temporary key generated for this run. Add the signing secrets (see README) so that updates keep the same signature."
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -noprompt -keystore "$KS" -storetype PKCS12 -alias ztmanager \
              -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=ZT Manager, O=ZT Manager"
            {
              echo "ZT_KEYSTORE_PASSWORD=$PASS"
              echo "ZT_KEY_ALIAS=ztmanager"
              echo "ZT_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
          fi
          echo "ZT_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect and verify APKs
        id: collect
        run: |
          VERSION=$(grep -E '^val appVersionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          OUT=app/build/outputs/apk/release
          ls -la "$OUT"
          cp "$OUT/app-arm64-v8a-release.apk" "dist/ZT-Manager-v${VERSION}-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/ZT-Manager-v${VERSION}-armeabi-v7a.apk"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          for apk in dist/*.apk; do
            echo "Verifying $apk"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZT-Manager-v${{ steps.collect.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Decide release
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${{ steps.collect.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || [[ "$GITHUB_EVENT_NAME" == "push" && "$COMMIT_MESSAGE" == *"[release]"* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        if: steps.release.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.collect.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes_changes.md
          {
            echo "## What is new"
            if [ -s notes_changes.md ]; then cat notes_changes.md; else echo "See CHANGELOG.md for details."; fi
            echo
            echo "## Downloads"
            echo
            echo "| File | Devices |"
            echo "| --- | --- |"
            echo "| \`ZT-Manager-v${VERSION}-arm64-v8a.apk\` | 64-bit ARM, most phones |"
            echo "| \`ZT-Manager-v${VERSION}-armeabi-v7a.apk\` | 32-bit ARM, older devices |"
            echo
            echo "Requires Android 8.0 or newer. Checksums are listed in \`SHA256SUMS.txt\`."
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ZT Manager ${{ steps.release.outputs.tag }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
